# Деплой сервера Zaapo! на Render (https://render.com), режим Blueprint:
# New → Blueprint → выбрать этот репозиторий.
#
# Диск не подключаем: на бесплатном плане Render его нет, а файловая
# система там эфемерна. Поэтому база по умолчанию живёт в файле и
# обнуляется при перезапуске. Чтобы таблицы дня сохранялись, заведите
# бесплатную базу Turso и добавьте в настройках сервиса переменные
# DATABASE_URL (libsql://…) и DATABASE_AUTH_TOKEN — код тот же.
services:
  - type: web
    name: zaapo-server
    runtime: node
    plan: free
    # --prod=false: сборка требует devDependencies (esbuild), а NODE_ENV
    # ниже иначе заставил бы pnpm поставить только runtime-зависимости.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @doton/server build
    # Запускаем собранный бандл чистым node: в рантайме не нужны ни pnpm,
    # ни TypeScript.
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DAILY_SECRET
        generateValue: true
      # DATABASE_URL / DATABASE_AUTH_TOKEN — из Turso, добавить вручную.
      # TELEGRAM_BOT_TOKEN — добавить, когда появится бот.
