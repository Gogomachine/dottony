# Деплой сервера dotoscope на Render (https://render.com), режим Blueprint:
# New → Blueprint → выбрать этот репозиторий.
#
# Диск не подключаем: на бесплатном плане Render его нет, а файловая
# система там эфемерна. Поэтому база по умолчанию живёт в файле и
# обнуляется при перезапуске. Чтобы таблицы дня сохранялись, заведите
# бесплатную базу Turso и добавьте в настройках сервиса переменные
# DATABASE_URL (libsql://…) и DATABASE_AUTH_TOKEN — код тот же.
services:
  - type: web
    # Имя осталось от прежнего названия игры и менять его нельзя: по нему
    # Render узнаёт уже развёрнутый сервис. Другое имя — это новый сервис,
    # с новым адресом и без наших переменных окружения.
    name: zaapo-server
    runtime: node
    plan: free
    # Регион задаётся только при создании сервиса и потом не меняется.
    # По умолчанию это Oregon: для игроков из Европы это лишние 150–250 мс
    # на каждое сообщение дуэли. Новый сервис нужно заводить с
    # `region: frankfurt` — и перенести в него JWT_SECRET, иначе токены
    # в браузерах игроков перестанут подходить (docs/DEPLOY.md).
    # pnpm ставим напрямую через npm, без corepack: тот генерирует шимы
    # сразу для всех пакетных менеджеров и ломается на ненужном нам yarn,
    # причём по-разному от версии к версии — Render сам обновляет Node
    # внутри 22.x, и сборка падала на ровном месте.
    # Каталог npm — домашний: глобальный префикс может быть только для
    # чтения. Версия берётся из packageManager, чтобы не разъезжалась.
    # --prod=false: сборке нужны devDependencies (esbuild), иначе NODE_ENV
    # ниже заставил бы pnpm поставить только runtime-зависимости.
    buildCommand: >-
      export npm_config_prefix="$HOME/.npm-global" &&
      export PATH="$HOME/.npm-global/bin:$PATH" &&
      export PNPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")" &&
      npm install --global --no-fund --no-audit "pnpm@$PNPM_VERSION" &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @doton/server build
    # Запускаем собранный бандл чистым node: в рантайме не нужны ни pnpm,
    # ни TypeScript.
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Этим ключом подписаны токены игроков, а токен в браузере — это всё,
      # что есть у гостевого аккаунта. Сгенерированный однажды, он должен
      # пережить любой переезд: новый ключ = все гости потеряли рейтинг,
      # рекорды и наработку без возможности вернуть.
      - key: JWT_SECRET
        generateValue: true
      # Перед сервисом стоит балансировщик Render — один. Без этого числа
      # адрес игрока для сервера всегда адрес балансировщика, и счётчики
      # запросов считают всех вместе.
      - key: TRUST_PROXY
        value: '1'
      # Откуда браузеру можно ходить в API. Меняется вместе с адресом
      # клиента; пустая переменная означает «откуда угодно».
      - key: ALLOWED_ORIGINS
        value: https://gogomachine.github.io
      # DATABASE_URL / DATABASE_AUTH_TOKEN — из Turso, добавить вручную.
      # Токен бота — секрет, поэтому значение задаётся в дашборде, а не тут:
      # sync:false лишь объявляет переменную, чтобы Render о ней спросил.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Короткое имя мини-приложения из BotFather (/newapp). Без него
      # ссылки ведут в главное мини-приложение бота.
      - key: TELEGRAM_APP_NAME
        sync: false
