<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Zaapo! — соедини точки</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Cpolygon%20points='54.7,4.9%2024.4,50.4%2043.9,50.4%2034.8,94.7%2075.2,44.5%2062.1,44.5'%20fill='%23F2A93F'%20stroke='%238A4A15'%20stroke-width='6'%20stroke-linejoin='round'/%3E%3C/svg%3E" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --screen: #edf0f3;
      --board: #fafbfc;
      --board-border: #d8dee6;
      --grid-line: rgba(47, 79, 110, 0.08);
      --ink: #232b33;
      --muted: #9aa4af;
      --accent: #b87b4b;
      --control: #ffffff;
      --control-border: #d8dee6;
    }
    :root[data-theme='graphite'] {
      --screen: #202329;
      --board: #1a1d22;
      --board-border: #2b2f37;
      --grid-line: rgba(201, 146, 92, 0.09);
      --ink: #e6e4df;
      --muted: #8b8f97;
      --accent: #c9925c;
      --control: #262a31;
      --control-border: #2b2f37;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--screen);
      color: var(--ink);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.25s;
    }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }

    .app {
      width: min(100vw, 460px);
      padding: 18px 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      user-select: none;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.06em;
    }
    #mascot { flex-shrink: 0; }
    #mascot svg { display: block; }
    #mascot.bounce { animation: mascotBounce 0.7s ease-out; }
    @keyframes mascotBounce {
      0% { transform: scale(1) rotate(0deg); }
      30% { transform: scale(1.35) rotate(-10deg); }
      60% { transform: scale(1.15) rotate(7deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    header .spacer { flex: 1; }

    button {
      font: inherit;
      color: var(--ink);
      background: var(--control);
      border: 1px solid var(--control-border);
      border-radius: 10px;
      padding: 7px 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    button.active {
      border-color: var(--accent);
      color: var(--accent);
    }
    button:active { transform: translateY(1px); }

    .hud {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 10px;
    }
    .score-block { display: flex; flex-direction: column; gap: 2px; }
    .score-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    #score {
      font-size: 34px;
      font-weight: 800;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }
    .score-row { display: flex; align-items: baseline; gap: 10px; }
    #streak {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      background: var(--accent);
      border-radius: 8px;
      padding: 2px 9px;
      animation: streakPop 0.35s ease-out;
    }
    #streak[hidden] { display: none; }
    @keyframes streakPop {
      0% { transform: scale(0.6); opacity: 0; }
      60% { transform: scale(1.18); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .timer-block { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
    #time {
      font-size: 17px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .tbar {
      width: 110px;
      height: 5px;
      border-radius: 99px;
      background: var(--board-border);
      overflow: hidden;
    }
    .tbar i {
      display: block;
      height: 100%;
      border-radius: 99px;
      background: var(--accent);
      transition: width 0.3s linear;
    }

    .phase {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 26px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      border-radius: 10px;
      transition: background 0.2s, color 0.2s;
    }
    .phase.active {
      color: var(--phase-ink, #fff);
      background: var(--phase-bg, var(--accent));
    }
    .phase .swatch {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--swatch, transparent);
      vertical-align: -1px;
    }

    .versus {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 10px;
      background: var(--control);
      border: 1px solid var(--control-border);
    }
    .versus[hidden] { display: none; }
    .vs-name {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .vs-score { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .vs-gap {
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      min-width: 54px;
      text-align: right;
    }
    .vs-gap.ahead { color: #2f9e68; }
    .vs-gap.behind { color: #d9483b; }

    #duel-record { font-size: 12px; color: var(--muted); }

    /* Лига и рейтинг: короткая строка, по нажатию — таблица. */
    .rank-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 99px;
      color: var(--accent);
      border-color: color-mix(in srgb, var(--accent) 45%, var(--control-border));
    }
    .rank-chip[hidden] { display: none; }
    .rank-chip .rating { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .rank-chip.provisional { color: var(--muted); border-color: var(--control-border); }

    .rating-line {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 14px;
      font-weight: 700;
    }
    .rating-line[hidden] { display: none; }
    .rating-line .delta { font-size: 22px; font-variant-numeric: tabular-nums; }
    .rating-line .delta.up { color: #2f9e68; }
    .rating-line .delta.down { color: #d9483b; }
    .rating-line .caption { font-size: 12px; font-weight: 600; color: var(--muted); }

    .board-wrap { position: relative; }
    canvas {
      display: block;
      width: 100%;
      touch-action: none;
      border-radius: 18px;
      border: 1px solid var(--board-border);
      background: var(--board);
    }
    .float-label {
      position: absolute;
      pointer-events: none;
      font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      font-weight: 800;
      font-size: 18px;
      color: var(--accent);
      transform: translate(-50%, -50%);
      animation: floatUp 0.9s ease-out forwards;
      z-index: 3;
    }
    @keyframes floatUp {
      0% { opacity: 0; translate: 0 6px; }
      15% { opacity: 1; }
      100% { opacity: 0; translate: 0 -34px; }
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .controls .spacer { flex: 1; }
    #seed {
      font-size: 12px;
      color: var(--muted);
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: color-mix(in srgb, var(--screen) 72%, transparent);
      backdrop-filter: blur(4px);
      z-index: 10;
    }
    .overlay[hidden] { display: none; }
    .modal {
      background: var(--control);
      border: 1px solid var(--control-border);
      border-radius: 18px;
      padding: 32px 40px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.35);
    }
    .modal h2 { font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
    #final-score {
      font-size: 44px;
      font-weight: 800;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }
    #over-note { font-size: 14px; color: var(--muted); max-width: 260px; white-space: pre-line; }

    #room-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 14px 18px;
      border-radius: 12px;
      background: color-mix(in srgb, var(--accent) 10%, transparent);
      border: 1px solid var(--control-border);
    }
    #room-box[hidden] { display: none; }
    .room-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    #room-code {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 0.16em;
      color: var(--accent);
    }
    .board-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 240px;
      max-height: 40vh;
      overflow-y: auto;
      text-align: left;
      font-size: 14px;
    }
    .board-list li {
      display: grid;
      grid-template-columns: 30px 1fr auto;
      gap: 8px;
      padding: 5px 10px;
      border-radius: 8px;
    }
    .board-list li.me {
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      font-weight: 700;
    }
    /* ---------- Личный кабинет ---------- */

    .cabinet {
      padding: 22px 22px 18px;
      gap: 16px;
      width: min(92vw, 400px);
      text-align: left;
    }
    .cab-head { display: flex; align-items: center; gap: 12px; }
    #cab-mascot { flex-shrink: 0; }
    #cab-mascot svg { display: block; }
    .cab-who { display: flex; flex-direction: column; flex: 1; min-width: 0; }
    .cab-name {
      font-size: 20px;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cab-login { font-size: 12px; color: var(--muted); }
    #cab-rename { padding: 6px 10px; }

    .cab-league {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 12px 14px;
      border-radius: 12px;
      background: color-mix(in srgb, var(--accent) 10%, transparent);
      border: 1px solid var(--control-border);
      font-size: 13px;
      font-weight: 700;
    }
    .cab-league .league-name { font-size: 17px; font-weight: 800; color: var(--accent); }
    .cab-league .league-note { font-size: 12px; font-weight: 600; color: var(--muted); }
    .cab-league .league-bar {
      height: 5px;
      border-radius: 99px;
      background: var(--board-border);
      overflow: hidden;
    }
    .cab-league .league-bar i {
      display: block;
      height: 100%;
      border-radius: 99px;
      background: var(--accent);
    }

    .cab-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .cab-stats .stat { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .stat-value { font-size: 18px; font-weight: 800; }
    .stat-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
    }

    .cab-sub {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .history {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 34vh;
      overflow-y: auto;
      font-size: 13px;
    }
    .history li {
      display: grid;
      grid-template-columns: 6px 1fr auto auto;
      align-items: center;
      gap: 9px;
      padding: 7px 8px;
      border-radius: 9px;
      background: color-mix(in srgb, var(--ink) 3%, transparent);
    }
    .history li.playable { cursor: pointer; }
    .history li.playable:active { transform: translateY(1px); }
    .history .mark { width: 6px; height: 24px; border-radius: 99px; background: var(--muted); }
    .history li.win .mark { background: #2f9e68; }
    .history li.loss .mark { background: #d9483b; }
    .history .who { display: flex; flex-direction: column; min-width: 0; }
    .history .who b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history .when { font-size: 11px; color: var(--muted); }
    .history .pts { font-family: ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .history .rd { font-size: 12px; font-weight: 700; min-width: 38px; text-align: right; }
    .history .rd.up { color: #2f9e68; }
    .history .rd.down { color: #d9483b; }
    .history .empty { color: var(--muted); background: none; display: block; padding: 4px 0; }

    .cab-actions { display: flex; gap: 8px; }
    .cab-actions button { flex: 1; }

    .replay-bar {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 10px 8px 16px;
      border-radius: 99px;
      background: var(--control);
      border: 1px solid var(--accent);
      box-shadow: 0 12px 30px -14px rgba(0, 0, 0, 0.5);
      font-size: 13px;
      font-weight: 700;
      z-index: 9;
    }
    .replay-bar[hidden] { display: none; }

    .board-list .rank { color: var(--muted); font-variant-numeric: tabular-nums; }
    .board-list .who { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
    .board-list .who-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .board-list .who-league { font-size: 11px; font-weight: 600; color: var(--muted); }
    .board-list .pts {
      font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <span id="mascot"></span>
      <span class="logo">ZAAPO!</span>
      <span class="spacer"></span>
      <button id="theme-toggle" title="Сменить тему">◐</button>
    </header>

    <div class="hud">
      <div class="score-block">
        <span class="score-label">Вольты</span>
        <span class="score-row">
          <span id="score" class="mono">0</span>
          <span id="streak" class="mono" hidden></span>
        </span>
      </div>
      <div class="timer-block">
        <span id="time" class="mono">3:00</span>
        <div class="tbar"><i id="time-fill" style="width: 100%"></i></div>
      </div>
    </div>

    <div id="versus" class="versus" hidden>
      <span class="vs-name" id="vs-name">Соперник</span>
      <span class="vs-score mono" id="vs-score">0</span>
      <span class="vs-gap mono" id="vs-gap"></span>
    </div>

    <div id="phase" class="phase"><span id="phase-text">&nbsp;</span></div>

    <div class="board-wrap">
      <canvas id="game"></canvas>
    </div>

    <div class="controls">
      <button id="mode-sprint" class="active">Спринт</button>
      <button id="mode-free">Свободно</button>
      <button id="mode-daily">Вызов дня</button>
      <span class="spacer"></span>
      <button id="new-board">Новая плата</button>
      <span id="seed" class="mono"></span>
    </div>

    <div class="controls">
      <button id="mode-duel">⚡ Дуэль</button>
      <button id="invite">Позвать друга</button>
      <button id="join-code">Ввести код</button>
      <span class="spacer"></span>
      <button id="rank-chip" class="rank-chip" hidden></button>
    </div>
    <div class="controls">
      <span id="duel-record" class="mono"></span>
    </div>

  </div>

  <div id="cabinet" class="overlay" hidden>
    <div class="modal cabinet">
      <div class="cab-head">
        <div id="cab-mascot"></div>
        <div class="cab-who">
          <span id="cab-name" class="cab-name"></span>
          <span id="cab-login" class="cab-login"></span>
        </div>
        <button id="cab-rename" title="Сменить имя">✎</button>
      </div>

      <div id="cab-league" class="cab-league"></div>

      <div class="cab-stats">
        <div class="stat"><span id="cab-rating" class="stat-value mono"></span><span class="stat-label">рейтинг</span></div>
        <div class="stat"><span id="cab-rank" class="stat-value mono"></span><span class="stat-label">место</span></div>
        <div class="stat"><span id="cab-duels" class="stat-value mono"></span><span class="stat-label">дуэли</span></div>
        <div class="stat"><span id="cab-daily" class="stat-value mono"></span><span class="stat-label">вызов дня</span></div>
      </div>

      <h3 class="cab-sub">Последние матчи</h3>
      <ol id="cab-history" class="history"></ol>

      <div class="cab-actions">
        <button id="cab-rating-board">Таблица рейтинга</button>
        <button id="cab-close">Закрыть</button>
      </div>
    </div>
  </div>

  <div id="replay-bar" class="replay-bar" hidden>
    <span id="replay-text">Реплей</span>
    <button id="replay-stop">Стоп</button>
  </div>

  <div id="game-over" class="overlay" hidden>
    <div class="modal">
      <div id="over-mascot"></div>
      <h2 id="over-title">Время вышло</h2>
      <span id="final-score" class="mono">0</span>
      <div id="rating-line" class="rating-line" hidden></div>
      <p id="over-note" hidden></p>
      <div id="room-box" hidden>
        <span class="room-label">Код комнаты</span>
        <span id="room-code" class="mono"></span>
        <button id="copy-link">Скопировать ссылку</button>
      </div>
      <ol id="daily-board" class="board-list" hidden></ol>
      <button id="modal-action">Понятно</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
